<!doctype html>

<meta charset="utf-8">

<title>SevaHub – Service Marketplace</title>
<meta name="description" content="SevaHub cooperative household and community gig services platform">
<meta name="theme-color" content="#b95417">
<script>
(function(){
  try{
    const k='sevahub_ui_route_v1';
    const r=JSON.parse(localStorage.getItem(k)||'null');
    if(r&&String(r.view||'').includes('support')) localStorage.removeItem(k);
  }catch(e){try{localStorage.removeItem('sevahub_ui_route_v1')}catch(_){} }

  function showBootError(message){
    try{
      const app=document.getElementById('app');
      if(!app)return;
      if(app.dataset.sevahubRendered==='1')return;
      app.innerHTML='<main style="font-family:system-ui;padding:24px;max-width:680px;margin:auto">'+
        '<h2>SevaHub could not finish loading</h2>'+
        '<p style="line-height:1.5">'+String(message||'A startup file could not load.').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})+'</p>'+
        '<button onclick="location.reload()" style="padding:11px 16px;border:0;border-radius:10px;background:#b95417;color:white;font-weight:700">Retry</button>'+
        '<p style="opacity:.65;font-size:13px;margin-top:16px">Server connection is separate from this frontend startup check.</p>'+
        '</main>';
    }catch(_){}
  }
  window.__sevahubBootError=showBootError;
  window.addEventListener('error',function(e){
    const msg=e&&e.message?e.message:(e&&e.target&&e.target.src?'Failed to load '+e.target.src:'Frontend startup error');
    showBootError(msg);
  },true);
  window.addEventListener('unhandledrejection',function(e){
    const reason=e&&e.reason;
    showBootError(reason&&reason.message?reason.message:String(reason||'Frontend startup request failed'));
  });
})();
</script>

<!-- Razorpay is intentionally non-blocking. If its CDN is slow/blocked, SevaHub still opens; checkout itself will report unavailable when used. -->
<script async src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
document.addEventListener('DOMContentLoaded',function(){
  setTimeout(function(){
    try{
      const app=document.getElementById('app');
      if(typeof render==='function'){
        if(!app||!app.querySelector('.landing,.dashboard,.auth-shell,.login-page,.auth-home,.nav')) render();
        if(app) app.dataset.sevahubRendered='1';
      }else if(window.__sevahubBootError){
        window.__sevahubBootError('Main app script did not load.');
      }
    }catch(e){if(window.__sevahubBootError)window.__sevahubBootError(e.message||String(e))}
  },1500);
});
</script>
